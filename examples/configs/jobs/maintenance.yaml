# Job: "maintenance". Demonstrates enable: false (ADR-0005).
#
# A disabled job is STILL fully validated — Registry lookup of `func`, cron
# parse, and signature bind all run. But the loader excludes it from the
# returned job list, so APScheduler never registers it. `gpscheduler list-jobs`
# omits it from the enabled list but prints a trailing summary line naming it,
# so you know it was checked. Flip `enable: true` to activate it.
#
# This Fail-Early behavior catches config rot: a typo here fails at load time,
# not the day someone re-enables the job.
cfg_class_name: GPJobConfig

func: "demo_jobs.maintenance.rebuild_index"

# Weekly: every Monday at 02:00 local. `1` in the day-of-week field = Monday
# under POSIX cron numbering (0=Sun..6=Sat, 7 also = Sun), 5-segment form.
cron: "0 2 * * 1"

# No args or kwargs: rebuild_index() takes none.
args: []
kwargs: {}

# Disabled: validated but not registered.
enable: false
